<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Tron-Style Fitness Tracker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            color: #00ffff;
        }
        #container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            text-shadow: 0 0 5px #00ffff;
        }
        #calibration {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }
        button {
            background: rgba(0, 200, 200, 0.3);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: rgba(0, 200, 200, 0.5);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="ui">
        <h1>TRON KINETIC TRACKER v0.0.3 <span id="timestamp"></span></h1>
        <p id="rotation-data">Awaiting spatial calibration...</p>
    </div>
    <div id="calibration">
        <button id="calibrate-btn">CALIBRATE GRID</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="SCRIPTS/orientation.js"></script>
    <script src="SCRIPTS/main.js"></script>
</body>
</html>
