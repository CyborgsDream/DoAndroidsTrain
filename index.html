<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Tron-Style Fitness Tracker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            color: #00ffff;
        }
        #container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            text-shadow: 0 0 5px #00ffff;
        }
        #calibration {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }
        button {
            background: rgba(0, 200, 200, 0.3);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: rgba(0, 200, 200, 0.5);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="ui">
        <h1>TRON KINETIC TRACKER v0.0.2b</h1>
        <p id="rotation-data">Awaiting spatial calibration...</p>
    </div>
    <div id="calibration">
        <button id="calibrate-btn">CALIBRATE GRID</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // ====== INITIALIZATION ====== //
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.getElementById('container').appendChild(renderer.domElement);

        // ====== TRON-STYLE GRID ====== //
        const gridSize = 20;
        const gridHelper = new THREE.GridHelper(gridSize, gridSize * 2, 0x00ffff, 0x00ffff);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // ====== ENERGY TRAIL ====== //
        const trailGeometry = new THREE.BufferGeometry();
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
        const trail = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(trail);

        // ====== SENSOR DATA ====== //
        let alpha = 0, beta = 0, gamma = 0;
        let isCalibrated = false;
        let screenOrientation = (window.orientation || (screen.orientation && screen.orientation.angle) || 0);
        const zee = new THREE.Vector3(0, 0, 1);
        const euler = new THREE.Euler();
        const q0 = new THREE.Quaternion();
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
        let calibrationQuaternion = new THREE.Quaternion();

        // ====== PERMISSION HANDLER ====== //
        function requestMotionPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }
        }

        // ====== DEVICE ORIENTATION HANDLER ====== //
        function computeQuaternion(a, b, g, orient) {
            euler.set(
                THREE.MathUtils.degToRad(b),
                THREE.MathUtils.degToRad(a),
                THREE.MathUtils.degToRad(-g),
                'YXZ'
            );
            const quaternion = new THREE.Quaternion();
            quaternion.setFromEuler(euler); // device orientation
            quaternion.multiply(q1);        // adjust for camera facing
            quaternion.multiply(q0.setFromAxisAngle(zee, -THREE.MathUtils.degToRad(orient)));
            return quaternion;
        }

        window.addEventListener('deviceorientation', (event) => {
            alpha = event.alpha || 0;  // Z-axis (compass)
            beta = event.beta || 0;    // X-axis (front-back tilt)
            gamma = event.gamma || 0;  // Y-axis (left-right tilt)

            const quat = computeQuaternion(alpha, beta, gamma, screenOrientation);

            if (!isCalibrated) {
                camera.quaternion.copy(quat);
            } else {
                const adjustedQuat = calibrationQuaternion.clone().invert().multiply(quat);
                camera.quaternion.copy(adjustedQuat);
            }

            const camEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
            document.getElementById('rotation-data').innerHTML = `
                KINETIC FEEDBACK:<br>
                α: ${THREE.MathUtils.radToDeg(camEuler.y).toFixed(1)}°<br>
                β: ${THREE.MathUtils.radToDeg(camEuler.x).toFixed(1)}°<br>
                γ: ${THREE.MathUtils.radToDeg(camEuler.z).toFixed(1)}°<br>
            `;

            // Update energy trail (simulated)
            updateEnergyTrail(THREE.MathUtils.radToDeg(camEuler.x), THREE.MathUtils.radToDeg(camEuler.z));
        });

        window.addEventListener('orientationchange', () => {
            screenOrientation = window.orientation || (screen.orientation && screen.orientation.angle) || 0;
        });

        // ====== CALIBRATION BUTTON ====== //
        document.getElementById('calibrate-btn').addEventListener('click', () => {
            requestMotionPermission();
            calibrationQuaternion.copy(computeQuaternion(alpha, beta, gamma, screenOrientation));
            isCalibrated = true;
            document.getElementById('rotation-data').innerHTML = "GRID SYNCHRONIZED.";
        });

        // ====== ENERGY TRAIL ANIMATION ====== //
        function updateEnergyTrail(beta, gamma) {
            const points = [];
            const segments = 20;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = Math.sin(t * Math.PI * 2) * 5 * (gamma / 90);
                const y = Math.cos(t * Math.PI * 2) * 5 * (beta / 90);
                const z = -t * 5;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            trailGeometry.setFromPoints(points);
        }

        // ====== CAMERA POSITION ====== //
        camera.position.z = 10;

        // ====== RENDER LOOP ====== //
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // ====== RESPONSIVE DESIGN ====== //
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
